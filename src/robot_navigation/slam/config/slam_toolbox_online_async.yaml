slam_toolbox:
  ros__parameters:

    # ── Solver ───────────────────────────────────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ── Frame IDs ─────────────────────────────────────────────────────────────
    # These MUST match what the Tugbot DiffDrive plugin and bridge publish.
    # DiffDrive plugin in model.sdf:
    #   <frame_id>odom</frame_id>
    #   <child_frame_id>base_link</child_frame_id>
    # The bridge maps /model/tugbot/tf → /tf which carries odom→base_link.
    odom_frame: odom
    map_frame: map
    base_frame: base_link

    # ── Scan Topic ────────────────────────────────────────────────────────────
    # Bridged from /model/tugbot/scan_front (scan_front sensor, 2D, 10 Hz).
    scan_topic: /scan

    # ── Mapping Mode ─────────────────────────────────────────────────────────
    use_map_saver: true
    mode: mapping

    # ── Timing ───────────────────────────────────────────────────────────────
    # scan_front runs at 10 Hz; accept every scan.
    throttle_scans: 1
    minimum_time_interval: 0.1  # seconds between accepted scans

    # How often slam_toolbox publishes the accumulated map.
    map_update_interval: 3.0    # seconds

    # TF transform publication period (slam_toolbox publishes map→odom).
    transform_publish_period: 0.05

    # ── Map Resolution ────────────────────────────────────────────────────────
    # 5 cm/cell gives good detail for warehouse shelving.
    resolution: 0.05

    # ── Range Limits ──────────────────────────────────────────────────────────
    # scan_front: min=0.01 m, max=5.0 m (from model SDF).
    # Clamp here to match sensor physical range.
    min_laser_range: 0.05
    max_laser_range: 5.0

    # ── TF Timeouts ───────────────────────────────────────────────────────────
    transform_timeout: 0.5
    tf_buffer_duration: 30.0

    # ── Scan Matching ─────────────────────────────────────────────────────────
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.3   # m before adding a new pose node
    minimum_travel_heading: 0.3    # rad

    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 7.0

    # ── Loop Closure ─────────────────────────────────────────────────────────
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ── Correlation ───────────────────────────────────────────────────────────
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ── Scan Matcher Penalties ────────────────────────────────────────────────
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # ── Misc ──────────────────────────────────────────────────────────────────
    debug_logging: false
    restamp_tf: false
    stack_size_to_use: 40000000
    enable_interactive_mode: true
    check_min_dist_and_heading_precisely: false
    min_pass_through: 2
    occupancy_threshold: 0.1
